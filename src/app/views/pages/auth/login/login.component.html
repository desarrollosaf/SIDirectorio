<div class="container">
  <div class="row w-100 mx-0 auth-page">
    <div class="col-md-8 col-xl-6 mx-auto">
      <div class="card">
        <div class="row">
          <div class="col-md-4 pe-md-0">
            <div
              class="auth-side-wrapper d-flex align-items-center justify-content-center"
              style="background-color: #1e3a5f;"
            >
              <img
                src="https://administracionyfinanzasplem.gob.mx/resdirectorio/assets/img/logo/logo_congreso.svg"
                alt="Logo Gobierno"
                style="width: 80%; padding: 16px;"
              />
            </div>
          </div>
          <div class="col-md-8 ps-md-0">
            <div class="auth-form-wrapper px-4 py-5">
              <h5 class="fw-semibold mb-1">Directorio Telefónico</h5>
              <p class="text-secondary mb-4">Ingresa tus credenciales para continuar</p>

              <div *ngIf="error" class="alert alert-danger py-2 mb-3">
                {{ error }}
              </div>

              <form [formGroup]="form" (ngSubmit)="onLoggedin($event)">
                <div class="mb-3">
                  <label for="rfc" class="form-label">RFC</label>
                  <input
                    type="text"
                    id="rfc"
                    class="form-control"
                    formControlName="rfc"
                    placeholder="Ej. GANJ931118"
                    autocomplete="username"
                    [class.is-invalid]="form.get('rfc')?.invalid && form.get('rfc')?.touched"
                  />
                  <div class="invalid-feedback">Ingresa tu RFC</div>
                </div>

                <div class="mb-4">
                  <label for="password" class="form-label">Contraseña</label>
                  <input
                    type="password"
                    id="password"
                    class="form-control"
                    formControlName="password"
                    autocomplete="current-password"
                    placeholder="Contraseña"
                    [class.is-invalid]="form.get('password')?.invalid && form.get('password')?.touched"
                  />
                  <div class="invalid-feedback">Ingresa tu contraseña</div>
                </div>

                <button type="submit" class="btn btn-primary me-2" [disabled]="loading">
                  <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
                  {{ loading ? 'Verificando...' : 'Iniciar sesión' }}
                </button>
              </form>

              <a routerLink="/directorio" class="d-block mt-3 text-secondary">
                ← Regresar al directorio
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
