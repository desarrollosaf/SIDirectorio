<div class="page-content">

  <nav class="page-breadcrumb">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a href="#">Inicio</a></li>
      <li class="breadcrumb-item active">Reportes</li>
    </ol>
  </nav>

  <div *ngIf="error" class="alert alert-danger alert-dismissible mb-4">
    {{ error }}
    <button class="btn-close" (click)="error = null"></button>
  </div>

  <div class="row g-4">

    <!-- Reporte Directivos -->
    <div class="col-md-6">
      <div class="card h-100">
        <div class="card-body d-flex flex-column">
          <div class="d-flex align-items-center gap-3 mb-3">
            <div class="d-inline-flex align-items-center justify-content-center rounded-circle bg-primary-subtle"
                 style="width:48px;height:48px;flex-shrink:0;">
              <i class="feather icon-file-text text-primary" style="font-size:22px;"></i>
            </div>
            <div>
              <h6 class="card-title mb-0">Reporte Directivos</h6>
              <p class="text-muted fs-12px mb-0">Extensión privada y pública por área</p>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-medium">Dependencia</label>
            <select class="form-select" [(ngModel)]="depIdDirectivos" [disabled]="loadingDeps">
              <option [value]="0">Todas las dependencias</option>
              <option *ngFor="let d of dependencias" [value]="d.id">{{ d.nombre }}</option>
            </select>
          </div>

          <div class="mt-auto">
            <button class="btn btn-primary w-100"
                    (click)="descargarDirectivos()"
                    [disabled]="descargandoDirectivos || loadingDeps">
              <span *ngIf="descargandoDirectivos" class="spinner-border spinner-border-sm me-2"></span>
              <i *ngIf="!descargandoDirectivos" class="feather icon-download me-2"></i>
              {{ descargandoDirectivos ? 'Generando PDF…' : 'Descargar' }}
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Reporte General (Directorio Telefónico) -->
    <div class="col-md-6">
      <div class="card h-100">
        <div class="card-body d-flex flex-column">
          <div class="d-flex align-items-center gap-3 mb-3">
            <div class="d-inline-flex align-items-center justify-content-center rounded-circle bg-success-subtle"
                 style="width:48px;height:48px;flex-shrink:0;">
              <i class="feather icon-phone text-success" style="font-size:22px;"></i>
            </div>
            <div>
              <h6 class="card-title mb-0">Directorio Telefónico</h6>
              <p class="text-muted fs-12px mb-0">Directorio general para distribución</p>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-medium">Dependencia</label>
            <select class="form-select" [(ngModel)]="depIdGeneral" [disabled]="loadingDeps">
              <option [value]="0">Todas las dependencias</option>
              <option *ngFor="let d of dependencias" [value]="d.id">{{ d.nombre }}</option>
            </select>
          </div>

          <div class="mt-auto">
            <button class="btn btn-success w-100"
                    (click)="descargarGeneral()"
                    [disabled]="descargandoGeneral || loadingDeps">
              <span *ngIf="descargandoGeneral" class="spinner-border spinner-border-sm me-2"></span>
              <i *ngIf="!descargandoGeneral" class="feather icon-download me-2"></i>
              {{ descargandoGeneral ? 'Generando PDF…' : 'Descargar' }}
            </button>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
